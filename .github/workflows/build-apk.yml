name: RAFTAR Android APK Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable & Build Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
          mkdir -p ../../release-assets
          cp app/build/outputs/apk/debug/*.apk ../../release-assets/RAFTAR-Athletic-Intelligence-Debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAFTAR-Athletic-Intelligence-Debug-APK
          path: release-assets/RAFTAR-Athletic-Intelligence-Debug.apk

      - name: Publish GitHub Release via Native GitHub CLI
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.0.6"
          fi
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" release-assets/RAFTAR-Athletic-Intelligence-Debug.apk \
            --title "RAFTAR Athletic Intelligence $TAG" \
            --notes "Official Android Release APK for RAFTAR Athletic Intelligence Platform (120Hz Ultra-Smooth Engine)."
