name: RAFTAR Android APK Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable & Build Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
          mkdir -p ../../release-assets
          cp app/build/outputs/apk/debug/*.apk ../../release-assets/RAFTAR-Athletic-Intelligence-Debug.apk || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAFTAR-Athletic-Intelligence-Debug-APK
          path: release-assets/RAFTAR-Athletic-Intelligence-Debug.apk

      - name: Create GitHub Release with APK Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/RAFTAR-Athletic-Intelligence-Debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
          tag_name: ${{ github.ref_name }}
          name: "RAFTAR Athletic Intelligence ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
