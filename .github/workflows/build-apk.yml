name: RAFTAR Android APK Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          cd mobile/android
          gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAFTAR-Athletic-Intelligence-Debug-APK
          path: mobile/android/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release with APK Asset
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          tag_name: ${{ github.ref_name || 'v1.0.1' }}
          name: "RAFTAR Athletic Intelligence ${{ github.ref_name || 'v1.0.1' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
