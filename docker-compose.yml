version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: raftar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: raftar_db
      POSTGRES_USER: raftar_admin
      POSTGRES_PASSWORD: raftar_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raftar_admin -d raftar_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: raftar_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_secure_password_2026
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secure_password_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raftar_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://raftar_admin:raftar_secure_password_2026@postgres:5432/raftar_db
      REDIS_URL: redis://:redis_secure_password_2026@redis:6379
      JWT_SECRET: raftar_super_secret_jwt_key_2026_production_grade
      JWT_EXPIRES_IN: 7d
    ports:
      - "4000:4000"

  nginx:
    image: nginx:alpine
    container_name: raftar_gateway
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  pgdata:
  redisdata:
